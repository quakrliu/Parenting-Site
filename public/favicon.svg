<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- BloomPath leaf/sprout favicon -->
  <!-- Brand: Primary #8D9B8E, Accent #C4A882, Light #F5F0EB -->
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A8E7B"/>
      <stop offset="100%" stop-color="#8D9B8E"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9DAE9E"/>
      <stop offset="100%" stop-color="#8D9B8E"/>
    </linearGradient>
  </defs>
  <!-- Circle background -->
  <circle cx="64" cy="64" r="60" fill="#F5F0EB"/>
  <!-- Stem -->
  <path d="M64 95 C64 95 64 55 64 55" stroke="#C4A882" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Left leaf -->
  <path d="M64 60 C50 50 35 38 38 25 C41 12 55 18 64 35" fill="url(#leafGrad)" opacity="0.95"/>
  <!-- Right leaf -->
  <path d="M64 55 C78 45 93 33 90 20 C87 7 73 13 64 30" fill="url(#leafGrad2)" opacity="0.9"/>
  <!-- Small left bud -->
  <path d="M64 75 C56 68 48 62 50 55 C52 48 58 52 64 62" fill="#8D9B8E" opacity="0.7"/>
  <!-- Small right bud -->
  <path d="M64 72 C72 65 80 59 78 52 C76 45 70 49 64 59" fill="#9DAE9E" opacity="0.65"/>
  <!-- Soil dots -->
  <circle cx="52" cy="98" r="3.5" fill="#C4A882" opacity="0.6"/>
  <circle cx="64" cy="100" r="4" fill="#C4A882" opacity="0.7"/>
  <circle cx="76" cy="98" r="3.5" fill="#C4A882" opacity="0.6"/>
</svg>
